[package]
name = "glintblade"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Gamepads go through gilrs on desktop; the browser build has keyboard and mouse only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs = "0.11"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false

[workspace]
