<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px var(--font-sans);color:var(--foreground);margin:0}p{margin:0 0 10px}.controls{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}button,select{font:inherit;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer}button.active{border-color:var(--primary);background:var(--accent)}.scene{display:none}.scene.active{display:block}.native{overflow-x:auto}.native img{width:384px;height:216px;max-width:none;image-rendering:pixelated;display:block}.native img.full{display:none}.native img.full.active{display:block}.crops{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}figure{margin:0}figcaption,.note{font-size:12px;color:var(--muted-foreground);margin:5px 0}.crop{width:224px;height:176px;image-rendering:pixelated;display:block}details{margin-top:10px}summary{cursor:pointer;color:var(--muted-foreground)}</style></head><body><p>Original stone volume restored. Ground-contact ink corrected.</p><div class="controls"><select aria-label="Location" id="location"><option value="west">West arena</option><option value="arrival">Entrance landing</option><option value="northwest">Northwest arena</option></select></div><div class="controls" id="stages"><button data-stage="original" class="">Original</button><button data-stage="rejected" class="">Rejected flat pass</button><button data-stage="candidate" class="active">Contact corrected</button></div><div class="scene " data-view="arrival"><div class="native"><img class="full " data-stage="original" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/original/arrival/native.png" alt="original actual native arrival view"><img class="full " data-stage="rejected" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/rejected/arrival/native.png" alt="rejected actual native arrival view"><img class="full active" data-stage="candidate" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/candidate/arrival/native.png" alt="candidate actual native arrival view"></div><div class="note">Actual 384 × 216 render · same frozen renderer and scene</div><div class="crops"><figure><figcaption>Original contact · 4× pixels</figcaption><img class="crop" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/original/arrival/contact.png" alt="Original contact enlarged"></figure><figure><figcaption>Corrected contact · 4× pixels</figcaption><img class="crop" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/candidate/arrival/contact.png" alt="Corrected contact enlarged"></figure></div></div><div class="scene active" data-view="west"><div class="native"><img class="full " data-stage="original" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/original/west/native.png" alt="original actual native west view"><img class="full " data-stage="rejected" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/rejected/west/native.png" alt="rejected actual native west view"><img class="full active" data-stage="candidate" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/candidate/west/native.png" alt="candidate actual native west view"></div><div class="note">Actual 384 × 216 render · same frozen renderer and scene</div><div class="crops"><figure><figcaption>Original contact · 4× pixels</figcaption><img class="crop" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/original/west/contact.png" alt="Original contact enlarged"></figure><figure><figcaption>Corrected contact · 4× pixels</figcaption><img class="crop" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/candidate/west/contact.png" alt="Corrected contact enlarged"></figure></div></div><div class="scene " data-view="northwest"><div class="native"><img class="full " data-stage="original" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/original/northwest/native.png" alt="original actual native northwest view"><img class="full " data-stage="rejected" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/rejected/northwest/native.png" alt="rejected actual native northwest view"><img class="full active" data-stage="candidate" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/candidate/northwest/native.png" alt="candidate actual native northwest view"></div><div class="note">Actual 384 × 216 render · same frozen renderer and scene</div><div class="crops"><figure><figcaption>Original contact · 4× pixels</figcaption><img class="crop" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/original/northwest/contact.png" alt="Original contact enlarged"></figure><figure><figcaption>Corrected contact · 4× pixels</figcaption><img class="crop" src="/home/krp/Projects/glintblade/art/pixellab/2026-11-02-summit-columns/contact-ink/evidence/candidate/northwest/contact.png" alt="Corrected contact enlarged"></figure></div></div><script>let stage='candidate';const views=document.querySelectorAll('.scene');document.querySelector('#location').onchange=e=>{views.forEach(v=>v.classList.toggle('active',v.dataset.view===e.target.value))};document.querySelectorAll('#stages button').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;document.querySelectorAll('#stages button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.full').forEach(x=>x.classList.toggle('active',x.dataset.stage===stage))});</script></body></html>
